<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Radar Eggs</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#080d18;color:white;font-family:Arial}
h1{text-align:center;color:#ffd84d;font-size:29px}
.sub{text-align:center;color:#aab6cc}
.panel{background:#172238;border:1px solid #34445b;border-radius:12px;padding:15px;margin:14px 0}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#ffd84d;color:#111;font-weight:bold;font-size:16px}
.card{background:#202e45;border:1px solid #40516b;border-radius:10px;padding:13px;margin:12px 0}
.small{color:#aab6cc;font-size:13px}
.status{color:#72e0a0;text-align:center}
</style>
</head>
<body>
<h1>🥚 MI RADAR EGGS</h1>
<p class="sub">Radar de servidores de Roblox</p>

<div class="panel">
<p>Servidores públicos disponibles</p>
<button onclick="cargar()">BUSCAR SERVIDORES</button>
<p id="estado" class="status">Listo para buscar</p>
</div>

<div id="resultados"></div>
<button onclick="mas()" id="mas" style="display:none">CARGAR MÁS</button>

<script>
const juego = "107778070777162";
let cursor = "";
let ocupado = false;

async function cargar(){
  cursor = "";
  document.getElementById("resultados").innerHTML = "";
  await buscar();
}

async function mas(){
  await buscar();
}

async function buscar(){
  if(ocupado) return;
  ocupado = true;
  const estado = document.getElementById("estado");
  estado.textContent = "Buscando servidores...";
  document.getElementById("mas").style.display = "none";

  try{
    let url = "https://games.roblox.com/v1/games/" + juego +
      "/servers/Public?sortOrder=Desc&limit=100";
    if(cursor) url += "&cursor=" + encodeURIComponent(cursor);

    const respuesta = await fetch(url);
    if(!respuesta.ok) throw new Error("Roblox respondió: " + respuesta.status);

    const datos = await respuesta.json();
    const lista = datos.data || [];
    const contenedor = document.getElementById("resultados");

    if(lista.length === 0 && !cursor){
      estado.textContent = "No se encontraron servidores.";
    }

    lista.forEach(server=>{
      const tarjeta = document.createElement("div");
      tarjeta.className = "card";

      const titulo = document.createElement("b");
      titulo.textContent = "Servidor público";

      const info = document.createElement("p");
      info.className = "small";
      info.textContent = "Jugadores: " + server.playing +
        " / " + server.maxPlayers;

      const boton = document.createElement("button");
      boton.textContent = "VER SERVIDOR";
      boton.onclick = ()=>{
        const enlace = "roblox://experiences/start?placeId=" +
          juego + "&gameInstanceId=" + server.id;
        window.location.href = enlace;
      };

      tarjeta.append(titulo,info,boton);
      contenedor.appendChild(tarjeta);
    });

    cursor = datos.nextPageCursor || "";
    document.getElementById("mas").style.display =
      cursor ? "block" : "none";

    estado.textContent = "Servidores encontrados: " + lista.length;
  }catch(error){
    estado.textContent = "Error al consultar Roblox: " + error.message;
  }finally{
    ocupado = false;
  }
}
</script>
</body>
</html>
