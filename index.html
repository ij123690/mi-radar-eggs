<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mi Radar Eggs</title>

<style>

*{box-sizing:border-box}

body{margin:0;padding:22px;background:#080d18;color:white;font-family:Arial,sans-serif}

h1{text-align:center;color:#ffd84d;font-size:29px}

.sub{text-align:center;color:#aab6cc;font-size:17px}

.panel{background:#172238;border:1px solid #34445f;border-radius:18px;padding:20px;margin:18px 0}

label{display:block;margin:12px 0}

select,button{width:100%;padding:16px;border-radius:12px;font-size:17px}

select{background:#293953;color:white;border:1px solid #ddd}

button{background:#ffd84d;color:#111;border:0;font-weight:bold;margin-top:12px}

.server{background:#24334d;padding:14px;border-radius:12px;margin:12px 0}

.small{color:#aab6cc;font-size:13px}

.status{text-align:center;color:#8be0a5;padding:10px}

a{color:#ffd84d}

</style>

</head>

<body>

<h1>🥚 MI RADAR EGGS</h1>

<p class="sub">Tu buscador de servidores de Roblox</p>

<div class="panel">

<h2>🎯 Filtros</h2>

<label>Rareza que buscas</label>

<select id="rarity">

<option value="all">Todos los huevos</option>

<option value="Secret">Secret</option>

<option value="Divine">Divine</option>

<option value="Eternal">Eternal</option>

</select>

<button onclick="buscar()">BUSCAR SERVIDORES</button>

<p class="small">La rareza se podrá filtrar cuando tengamos una fuente que informe qué huevo hay en cada servidor.</p>

</div>

<div class="panel">

<div id="status" class="status">Listo para buscar</div>

<div id="results"></div>

</div>

<p class="small">Esta versión consulta servidores públicos. No solicita tu contraseña ni tus datos de Roblox.</p>

<script>

const API="https://mi-radar-eggs-api.ij5084120.workers.dev";

async function buscar(){

 const status=document.getElementById("status");

 const results=document.getElementById("results");

 status.textContent="Buscando servidores públicos...";

 results.innerHTML="";

 try{

  const response=await fetch(API+"/servers");

  if(!response.ok) throw new Error("Error "+response.status);

  const data=await response.json();

  if(!data.data || !Array.isArray(data.data)) throw new Error("La API todavía no está conectada.");

  status.textContent="Servidores encontrados: "+data.data.length;

  data.data.forEach(server=>{

   const card=document.createElement("div");

   card.className="server";

   const title=document.createElement("b");

   title.textContent="Servidor público";

   const info=document.createElement("p");

   info.textContent="Jugadores: "+server.playing+" / "+server.maxPlayers;

   const join=document.createElement("button");

   join.textContent="VER SERVIDOR";

   join.onclick=()=>window.location.href=

    "https://www.roblox.com/games/107778070777162?gameInstanceId="+encodeURIComponent(server.id);

   card.append(title,info,join);

   results.appendChild(card);

  });

 }catch(error){

  status.textContent="No se pudo conectar todavía.";

  results.textContent=error.message;

 }

}

</script>

</body>

</html>
